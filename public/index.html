<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Live Snake Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- Control Panel -->
    <div id="control-panel">
      <div id="brand">🐍 TikTok Live Snake</div>
      <div id="connect-form">
        <input
          id="username-input"
          type="text"
          placeholder="@tiktok_username"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="connect-btn" title="Connect"><i data-lucide="plug"></i></button>
        <button id="disconnect-btn" disabled title="Disconnect"><i data-lucide="unplug"></i></button>
      </div>
      <div id="connection-status">
        <span id="status-dot" class="dot dot-gray"></span>
        <span id="status-text">Disconnected</span>
      </div>
    </div>
    <div id="streamroom-panel" hidden>
      <img src="/assets/images/streamroom.png" alt="Stream room" />
      <div id="member-greeting" hidden>
        <img
          src="/assets/images/stickers/Good%20Bye%20Hello%20Sticker%20by%20Pudgy%20Penguins.gif"
          alt="Hello"
        />
        <span class="member-greeting-text">Hello!</span>
      </div>
      <div id="like-sticker" hidden>
        <img src="/assets/images/stickers/giphy.webp" alt="Heart" />
      </div>
    </div>

    <!-- Main Content -->
    <div id="main-content">

      <!-- Game Column -->
      <div id="game-column">
        <div id="game-area">
          <canvas id="gameCanvas"></canvas>
          <div id="death-overlay">
            <canvas id="fireworksCanvas"></canvas>
            <div id="death-content">
              <div id="death-title">LOSS</div>
              <div id="death-countdown">5</div>
              <div id="death-subtitle">Resuming in...</div>
            </div>
          </div>
        </div>
        <div id="below-map-ui">
          <div id="side-panel">
            <div id="score-panel">
              <div class="stat-card">
                <div class="stat-value" id="win-count">0</div>
                <div class="stat-label">Wins</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" id="loss-count">0</div>
                <div class="stat-label">Losses</div>
              </div>
              <div class="stat-card stat-card--inline">
                <div class="stat-value" id="heart-count">0</div>
                <div class="stat-label stat-label--icon" aria-label="Hearts">♥</div>
              </div>
            </div>
            <div class="heart-reward-guide">
              <span>500</span>
              <span class="heart-icon">♥</span>
              <span>= +10 🍎 + 🪲 💡</span>
            </div>
            <div class="heart-reward-guide">
              <span>comment 222 = +2 🍎</span>
            </div>
            <div class="heart-reward-guide">
              <span>comment 111 = +1 🪲 💡</span>
            </div>
          </div>

          <div id="gift-ui">
            <div id="gift-feed"></div>
            <div id="gift-guide" aria-label="Gift effects">
              <div class="gift-guide-item">
                <img src="/assets/images/gift/rose.webp" alt="Rose" />
                <span>+5 🍎</span>
              </div>
              <div class="gift-guide-item">
                <img src="/assets/images/gift/Finger Heart.webp" alt="Finger Heart" />
                <span>+15 🍎</span>
              </div>
              <div class="gift-guide-item">
                <img src="/assets/images/gift/pig.webp" alt="Lucky Pig" />
                <span>spawn color star</span>
              </div>
              <div class="gift-guide-item">
                <img src="/assets/images/gift/tiktok.webp" alt="TikTok" />
                <span>+5 💣</span>
              </div>
              <div class="gift-guide-item">
                <span>follow spawns star</span>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
